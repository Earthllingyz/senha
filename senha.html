<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Restrito</title>
    <style>
        /* Centraliza o card de login na tela */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        #caixa-login {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            width: 320px;
            text-align: center;
        }

        h2 {
            margin-bottom: 25px;
            color: #1c1e21;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #dddfe2;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #1877f2;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #166fe5;
        }

        #mensagem-erro {
            color: #fa3e3e;
            font-size: 14px;
            margin-top: 15px;
            display: none; /* Começa escondido */
        }
    </style>
</head>
<body>

    <div id="caixa-login">
        <h2>Acesse sua conta</h2>
        <input type="text" id="campo-usuario" placeholder="Usuário">
        <input type="password" id="campo-senha" placeholder="Senha">
        <button onclick="verificarAcesso()">Entrar</button>
        <p id="mensagem-erro">Usuário ou senha incorretos!</p>
    </div>

    <!-- O JAVASCRIPT PRECISA ESTAR AQUI DENTRO -->
    <script>
        // Banco de dados de usuários
        const usuariosRegistrados = {
            "joao": "1234",
            "maria": "5678",
            "admin": "admin123"
        };

        const inputUsuario = document.getElementById("campo-usuario");
        const inputSenha = document.getElementById("campo-senha");

        // Função para verificar se a tecla Enter foi pressionada
        [inputUsuario, inputSenha].forEach(campo => {
            campo.addEventListener("keyup", (event) => {
                if (event.key === "Enter") verificarAcesso();
            });
        });

        function verificarAcesso() {
            let usuario = inputUsuario.value;
            let senha = inputSenha.value;
            let msgErro = document.getElementById("mensagem-erro");

            // Verifica se o usuário existe e se a senha está correta
            if (usuariosRegistrados[usuario] && usuariosRegistrados[usuario] === senha) {
                // REDIRECIONA PARA O HOME.HTML
                window.location.href = "home.html"; 
            } else {
                // Mostra a mensagem de erro e limpa o campo de senha
                msgErro.style.display = "block";
                inputSenha.value = "";
                inputSenha.focus();
            }
        }
    </script>

</body>
</html>

function carregarPergunta() {
    if (perguntaAtual < perguntas.length) {
        const p = perguntas[perguntaAtual];
        document.getElementById("contador").innerText = `Questão ${perguntaAtual + 1} de ${perguntas.length}`;
        document.getElementById("texto-pergunta").innerText = p.q;
        
        const caixaOpcoes = document.getElementById("caixa-opcoes");
        caixaOpcoes.innerHTML = "";

        // Criamos uma cópia das opções com o índice original para não perder a contagem de votos
        let opcoesEmbaralhadas = p.a.map((opcao, index) => ({ ...opcao, originalIndex: index }));
        
        // Algoritmo de embaralhamento (Shuffle)
        for (let i = opcoesEmbaralhadas.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [opcoesEmbaralhadas[i], opcoesEmbaralhadas[j]] = [opcoesEmbaralhadas[j], opcoesEmbaralhadas[i]];
        }

        opcoesEmbaralhadas.forEach((opcao) => {
            const btn = document.createElement("button");
            btn.className = "btn-opcao";
            btn.innerHTML = `<img src="${opcao.i}" alt="${opcao.t}"><span>${opcao.t}</span>`;
            // IMPORTANTE: O voto agora usa o originalIndex para somar na nação certa
            btn.onclick = () => registrarVoto(opcao.originalIndex);
            caixaOpcoes.appendChild(btn);
        });
    } else {
        mostrarResultado();
    }
}

// ... (mantenha o restante do código igual)

        function registrarVoto(index) {
            votos[index]++;
            perguntaAtual++;
            carregarPergunta();
        }

        function mostrarResultado() {
            document.getElementById("jogo").style.display = "none";
            document.getElementById("resultado").style.display = "block";

            let maxVotos = Math.max(...votos);
            let vencedor = votos.indexOf(maxVotos);

            const nacao = resultados[vencedor];
            document.getElementById("nacao-final").innerText = `Você pertence à ${nacao.n}!`;
            document.getElementById("imagem-nacao").src = nacao.i;
            document.getElementById("descricao-final").innerText = nacao.d;
        }

        carregarPergunta();
    </script>
